spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/cryptolab}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:cryptolab}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:cryptolab}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.sql.init.mode=never