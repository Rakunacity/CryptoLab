services:
  postgres:
    image: postgres:16
    container_name: cryptolab-postgres
    environment:
      POSTGRES_DB: cryptolab
      POSTGRES_USER: cryptolab
      POSTGRES_PASSWORD: cryptolab
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: